name: Build app

on:
  workflow_dispatch:
  push:
    branches: [vscode-claude-desktop]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build (unsigned)
        shell: bash
        run: |
          set +eo pipefail
          xcodebuild -scheme ClaudeIsland -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="" build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "error:|Error:|requires|BUILD FAILED" build.log | sort -u | head -40 | while IFS= read -r l; do echo "::error::${l//$'\n'/ }"; done
            tail -30 build.log | while IFS= read -r l; do echo "::warning::$l"; done
          fi
          exit $status
      - name: Zip app
        run: |
          set +eo pipefail
          cd build/Build/Products/Release
          ditto -c -k --keepParent *.app VibeNotch.zip
      - uses: actions/upload-artifact@v4
        with:
          name: VibeNotch
          path: build/Build/Products/Release/VibeNotch.zip
